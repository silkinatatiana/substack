<div class="post-engagement">
  <a class="post-engagement-item" href="{% url 'posts:detail' post.pk %}" aria-label="Лайки">
    <svg class="post-engagement-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <span>{{ post.likes_count|default:post.likes.count }}</span>
  </a>

  <a class="post-engagement-item" href="{% url 'posts:detail' post.pk %}" aria-label="Комментарии">
    <svg class="post-engagement-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>{{ post.comments_count|default:post.comments.count }}</span>
  </a>

  <span class="post-engagement-item post-engagement-category">
    <span class="category-badge">{{ post.category.name }}</span>
  </span>
</div>
