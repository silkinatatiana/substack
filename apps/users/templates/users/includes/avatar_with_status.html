{% with status=avatar_user.activity_status %}
<a href="{% url 'users:profile' avatar_user.pk %}"
   class="status-avatar status-avatar--{{ size }}"
   aria-label="{{ avatar_user.username }} — {{ status.label }}">
    <span class="status-avatar__image">
        {% if avatar_user.avatar %}
            <img src="{{ avatar_user.avatar.url }}" alt="">
        {% else %}
            <span class="status-avatar__initial">{{ avatar_user.username|first|upper }}</span>
        {% endif %}
    </span>
    <span class="status-avatar__indicator{% if status.is_active %} status-avatar__indicator--active{% endif %}"
          title="{{ status.label }}" aria-hidden="true"></span>
</a>
{% endwith %}
